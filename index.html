<style>
:root{
  --bg:#07152b; --bg2:#0b1f3a; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.11);
  --txt:#eef6ff; --mut:#9bb7e5; --acc:#3b9cff; --acc2:#6ee7ff; --warm:#ff9f1a;
  --input-bg:#0b2144; --input-border:#27467a; --code-bg:#051020;
  --ui:'Inter','Noto Sans Arabic',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  --ser:'Source Serif 4','Noto Sans Arabic',Georgia,'Times New Roman',serif;
}
html[data-theme="light"]{
  --bg:#f3f6fb; --bg2:#ffffff; --card:#ffffff; --line:rgba(15,35,65,.12);
  --txt:#0c1e36; --mut:#536b8c; --acc:#0066cc; --acc2:#0284c7; --warm:#d97706;
  --input-bg:#ffffff; --input-border:#cbd5e1; --code-bg:#f1f5f9;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--ui);color:var(--txt);line-height:1.6;
  background:radial-gradient(900px 500px at 50% -80px,rgba(59,156,255,.22),transparent 65%),linear-gradient(180deg,var(--bg2),var(--bg)) fixed;
  min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}
a{color:var(--acc2)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
section{scroll-margin-top:76px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(7,21,43,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
html[data-theme="light"] .top{background:rgba(255,255,255,.88)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--txt);font-weight:700;letter-spacing:-.3px;flex:none}
.brand svg, .brand img{width:34px;height:25px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(110,231,255,.6))}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:10px;font-size:.92rem;white-space:nowrap}
nav a:hover{color:var(--txt);background:var(--card)}

.theme-toggle{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
select{background:var(--input-bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.88rem}

/* hero */
.hero{text-align:center;padding:52px 0 34px}
.logo-ring{width:156px;height:156px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 30% 22%,#1b4478,#0a1c38 70%);border:2px solid rgba(110,231,255,.55);
  box-shadow:0 0 0 9px rgba(59,156,255,.09),0 0 60px rgba(59,156,255,.5),inset 0 0 28px rgba(110,231,255,.18);
  animation:bob 6s ease-in-out infinite}
html[data-theme="light"] .logo-ring{background:radial-gradient(circle at 30% 22%,#d4ebff,#b9ddff 70%);box-shadow:0 0 0 8px rgba(59,156,255,.15),0 8px 30px rgba(0,0,0,.08)}
.logo-ring svg{width:104px;height:74px;filter:drop-shadow(0 0 14px rgba(110,231,255,.85))}
.logo-ring img{width:100%;height:100%;object-fit:cover}
@keyframes bob{50%{transform:translateY(-7px)}}
.hero h1{font-family:var(--ser);font-size:clamp(2.3rem,7vw,3.6rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--txt),#5cb8ff 60%,#0284c7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--acc2);font-weight:600;margin:0 0 12px}
.lead{max-width:560px;margin:0 auto 24px;color:var(--mut);font-size:1.05rem}

/* search bar */
.search-container{max-width:500px;margin:0 auto 30px;position:relative}
.search-input{width:100%;padding:14px 20px;border-radius:14px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--txt);font-size:1rem;font-family:var(--ui)}
.search-input:focus{outline:2px solid var(--acc);border-color:transparent}

.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:600;color:#04101f;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,#7fd6ff,#3b9cff)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:#ff5d6c;color:#fff}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.55;cursor:wait}

/* blocks */
h2.sec{font-family:var(--ser);font-size:1.7rem;margin:0 0 16px;letter-spacing:-.01em}
.block{padding:30px 0}
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.store{display:block;text-align:center;text-decoration:none;color:#0b1f3a;background:#fff;font-weight:700;padding:14px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.store:hover{transform:translateY(-2px)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
html[data-theme="dark"] .tabs button.on{color:#04101f}

/* Google Books Embed Integration Section */
.gbooks-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:30px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.gbooks-search-form{display:flex;gap:10px;margin-top:14px}
@media(max-width:600px){.gbooks-search-form{flex-direction:column}}
.gbooks-input{flex:1;padding:12px 16px;border-radius:10px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--txt);font-family:var(--ui)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.pimg{display:block;aspect-ratio:16/10;background:#0a1c38}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pb h3{font-family:var(--ser);font-size:1.22rem;line-height:1.25;margin:0}
.pb h3 a{color:var(--txt);text-decoration:none}
.pb p{margin:0;color:var(--mut);font-size:.94rem}
.pm{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:.85rem;color:var(--mut)}
.more{font-weight:600}
.badge{align-self:flex-start;font-size:.78rem;font-weight:600;color:var(--acc2);border:1px solid rgba(110,231,255,.4);border-radius:999px;padding:2px 10px}
.badge.free{color:#22c55e;border-color:rgba(34,197,94,.4)}
.badge.paid{color:var(--warm);border-color:rgba(255,159,26,.4)}
</style>
</head>
